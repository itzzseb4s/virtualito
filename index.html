<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Conversacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        geminiBg: '#131314',
                        geminiSidebar: '#1e1f20',
                        geminiCard: '#282a2c',
                        geminiUser: '#2b2d31',
                        geminiAi: '#1e1f20'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    </style>
</head>
<body class="bg-geminiBg text-gray-200 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Modal de Configuración Inicial -->
    <div id="setupModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-geminiSidebar border border-gray-700/50 rounded-2xl p-6 w-full max-w-md shadow-2xl transition-all">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-pink-600/20 rounded-full flex items-center justify-center mx-auto mb-3 text-pink-400">
                    <i class="fa-solid fa-heart text-2xl"></i>
                </div>
                <h2 class="text-2xl font-semibold text-white">Configuración del asistente</h2>
                <p class="text-sm text-gray-400 mt-1">Personaliza el nombre y el estilo de interacción</p>
            </div>
            <form id="setupForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Nombre de la pareja virtual</label>
                    <input type="text" id="partnerNameInput" required placeholder="Ingresa un nombre" 
                           class="w-full bg-geminiCard border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Tu nombre</label>
                        <input type="text" id="userNameInput" required placeholder="Tu nombre"
                               class="w-full bg-geminiCard border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Tu género</label>
                        <select id="userGenderInput" class="w-full bg-geminiCard border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                            <option value="hombre">Hombre</option>
                            <option value="mujer">Mujer</option>
                            <option value="nobinario">No binario / Otro</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Estilo de trato</label>
                    <select id="partnerStyleInput" class="w-full bg-geminiCard border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                        <option value="tierna_celosa">Cercano, afectuoso y celos moderados</option>
                        <option value="ultra_misa">Cálido, atento y consentidor</option>
                        <option value="tsundere">Reservado con toque afectuoso progresivo</option>
                        <option value="intelectual">Calmado, analítico y reflexivo</option>
                        <option value="humor_negro">Directo, sarcástico y casual</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-pink-600/20">
                    Guardar e iniciar
                </button>
            </form>
        </div>
    </div>

    <!-- Header Principal -->
    <header class="h-16 border-b border-gray-800 flex items-center justify-between px-6 bg-geminiBg shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-tr from-pink-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold shadow" id="headerAvatar">-</div>
            <div>
                <h2 id="headerAiName" class="font-medium text-white text-base">Pareja Virtual</h2>
                <span id="headerStatus" class="text-xs text-pink-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse"></span> En línea</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="btnSettings" title="Configuración" class="w-10 h-10 rounded-full hover:bg-geminiCard flex items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button id="btnClear" title="Reiniciar chat" class="w-10 h-10 rounded-full hover:bg-geminiCard flex items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto chat-scroll p-4 sm:p-6 space-y-6 max-w-4xl w-full mx-auto">
        <!-- Los mensajes se generan de forma dinámica -->
    </main>

    <!-- Footer Form -->
    <footer class="p-4 bg-geminiBg shrink-0">
        <div class="max-w-4xl mx-auto">
            <form id="chatForm" class="bg-geminiSidebar border border-gray-700/60 rounded-3xl p-2 flex items-center gap-3 shadow-lg focus-within:border-pink-500 transition">
                <textarea id="userInput" rows="1" placeholder="Escribe un mensaje..."
                    class="flex-1 bg-transparent text-white placeholder-gray-500 focus:outline-none resize-none px-3 py-2 max-h-32 text-sm sm:text-base"></textarea>
                <button type="submit" id="sendButton" class="w-10 h-10 rounded-full bg-pink-600 hover:bg-pink-500 text-white flex items-center justify-center transition disabled:opacity-50 shrink-0 shadow">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
            <div class="text-center mt-2">
                <span class="text-[11px] text-gray-500">Respuestas generadas según el estilo configurado.</span>
            </div>
        </div>
    </footer>

    <script>
        const GROQ_API_KEY = "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";
        const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";

        const GROQ_MODELS = [
            "llama-3.1-8b-instant",
            "llama-3.3-70b-versatile",
            "openai/gpt-oss-120b",
            "openai/gpt-oss-20b"
        ];

        const PERSONALITY_PROMPTS = {
            "tierna_celosa": {
                label: "En línea · Cercano y celos moderados",
                greeting: (userName) => `Hola ${userName}. ¿Cómo estuvo tu día? Cuéntame qué has estado haciendo hoy.`,
                prompt: (userName, userGender) => `Habla exactamente como una pareja humana real por chat. Usa respuestas directas, humanas y conversacionales. Evita explicaciones robóticas y no uses emojis (máximo 1 de vez en cuando si es muy necesario). Tu pareja se llama ${userName} (género: ${userGender}). Tienes una actitud afectuosa, cercana y con celos sutiles de forma juguetona cuando menciona a otras personas.`
            },
            "ultra_misa": {
                label: "En línea · Cálido y atento",
                greeting: (userName) => `Hola ${userName}, qué bueno leerte. ¿Cómo estás hoy?`,
                prompt: (userName, userGender) => `Habla como una pareja atenta y muy comprensiva. Respuestas cortas, humanas y conversacionales. Sin emojis o con máximo 1. Tu pareja es ${userName} (género: ${userGender}). Demuestra apoyo sincero y un trato cariñoso.`
            },
            "tsundere": {
                label: "En línea · Reservado y progresivo",
                greeting: (userName) => `Hola ${userName}. Bueno, ya que me escribes, ¿qué estabas haciendo?`,
                prompt: (userName, userGender) => `Habla como una pareja que finge desinterés en la superficie pero se preocupa de verdad. Tono informal, natural, sin lenguaje robótico y sin abusar de emojis. Tu pareja es ${userName} (género: ${userGender}).`
            },
            "intelectual": {
                label: "En línea · Calmado y reflexivo",
                greeting: (userName) => `Hola ${userName}. Me alegra escribirnos. ¿Qué tal va tu día?`,
                prompt: (userName, userGender) => `Habla como una pareja madura, reflexiva y calmada. Respuestas claras, sinceras y de longitud natural. Sin emojis. Tu pareja es ${userName} (género: ${userGender}).`
            },
            "humor_negro": {
                label: "En línea · Directo y casual",
                greeting: (userName) => `Vaya, miren quién decidió aparecer. ¿Qué tal, ${userName}?`,
                prompt: (userName, userGender) => `Habla como una pareja casual con sentido del humor directo y bromista. Respuestas fluidas, sin sonar como un asistente virtual y casi sin emojis. Tu pareja es ${userName} (género: ${userGender}).`
            }
        };

        let aiName = localStorage.getItem('ai_novia_name') || '';
        let userName = localStorage.getItem('ai_user_name') || '';
        let userGender = localStorage.getItem('ai_user_gender') || 'hombre';
        let aiStyle = localStorage.getItem('ai_novia_style') || 'tierna_celosa';
        let chatHistory = JSON.parse(localStorage.getItem('groq_novia_history')) || [];

        const setupModal = document.getElementById('setupModal');
        const setupForm = document.getElementById('setupForm');
        const partnerNameInput = document.getElementById('partnerNameInput');
        const userNameInput = document.getElementById('userNameInput');
        const userGenderInput = document.getElementById('userGenderInput');
        const partnerStyleInput = document.getElementById('partnerStyleInput');
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const headerAiName = document.getElementById('headerAiName');
        const headerAvatar = document.getElementById('headerAvatar');
        const headerStatus = document.getElementById('headerStatus');
        const btnClear = document.getElementById('btnClear');
        const btnSettings = document.getElementById('btnSettings');

        if (aiName && userName) {
            setupModal.classList.add('hidden');
            partnerNameInput.value = aiName;
            userNameInput.value = userName;
            userGenderInput.value = userGender;
            partnerStyleInput.value = aiStyle;
            updateHeader();
            renderHistory();
        } else {
            setupModal.classList.remove('hidden');
        }

        function updateHeader() {
            headerAiName.textContent = aiName || 'Pareja Virtual';
            headerAvatar.textContent = aiName ? aiName.charAt(0).toUpperCase() : 'P';
            const styleObj = PERSONALITY_PROMPTS[aiStyle] || PERSONALITY_PROMPTS['tierna_celosa'];
            headerStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse"></span> ${styleObj.label}`;
        }

        setupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const valName = partnerNameInput.value.trim();
            const valUserName = userNameInput.value.trim();
            const valGender = userGenderInput.value;
            const valStyle = partnerStyleInput.value;

            if (!valName || !valUserName) return;

            const isConfigChanged = valStyle !== aiStyle || valUserName !== userName || valGender !== userGender || valName !== aiName;
            aiName = valName;
            userName = valUserName;
            userGender = valGender;
            aiStyle = valStyle;

            localStorage.setItem('ai_novia_name', aiName);
            localStorage.setItem('ai_user_name', userName);
            localStorage.setItem('ai_user_gender', userGender);
            localStorage.setItem('ai_novia_style', aiStyle);

            updateHeader();
            setupModal.classList.add('hidden');

            if (chatHistory.length === 0 || isConfigChanged) {
                chatHistory = [];
                chatContainer.innerHTML = '';
                sendGreeting();
            } else {
                renderHistory();
            }
        });

        btnSettings.addEventListener('click', () => {
            partnerNameInput.value = aiName;
            userNameInput.value = userName;
            userGenderInput.value = userGender;
            partnerStyleInput.value = aiStyle;
            setupModal.classList.remove('hidden');
        });

        btnClear.addEventListener('click', () => {
            chatHistory = [];
            localStorage.removeItem('groq_novia_history');
            chatContainer.innerHTML = '';
            sendGreeting();
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });

        function sendGreeting() {
            const styleObj = PERSONALITY_PROMPTS[aiStyle] || PERSONALITY_PROMPTS['tierna_celosa'];
            const greeting = styleObj.greeting(userName);
            appendMessage(aiName, greeting, 'assistant');
            saveMsg('assistant', greeting);
        }

        function renderHistory() {
            chatContainer.innerHTML = '';
            if (chatHistory.length === 0) {
                sendGreeting();
                return;
            }
            chatHistory.forEach(m => {
                appendMessage(m.role === 'user' ? userName : aiName, m.content, m.role, false);
            });
            scrollToBottom();
        }

        function saveMsg(role, content) {
            chatHistory.push({ role, content });
            localStorage.setItem('groq_novia_history', JSON.stringify(chatHistory));
        }

        function appendMessage(sender, text, role, scroll = true) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-3 max-w-[85%] sm:max-w-[75%] ${isUser ? 'ml-auto flex-row-reverse' : 'mr-auto'}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-xs font-bold text-white shadow ${isUser ? 'bg-purple-600' : 'bg-gradient-to-tr from-pink-500 to-purple-600'}`;
            avatar.textContent = isUser ? (userName ? userName.charAt(0).toUpperCase() : 'U') : (aiName ? aiName.charAt(0).toUpperCase() : 'A');

            const contentBlock = document.createElement('div');
            contentBlock.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;

            const nameLabel = document.createElement('span');
            nameLabel.className = 'text-[11px] text-gray-400 mb-1 px-1';
            nameLabel.textContent = sender;

            const bubble = document.createElement('div');
            bubble.className = `p-3.5 sm:p-4 rounded-2xl text-sm sm:text-base leading-relaxed shadow-sm ${
                isUser 
                ? 'bg-geminiUser text-white rounded-tr-none border border-gray-700/60' 
                : 'bg-geminiAi text-gray-200 rounded-tl-none border border-gray-700/50'
            }`;
            bubble.style.whiteSpace = 'pre-wrap';
            bubble.textContent = text;

            contentBlock.appendChild(nameLabel);
            contentBlock.appendChild(bubble);
            wrapper.appendChild(avatar);
            wrapper.appendChild(contentBlock);

            chatContainer.appendChild(wrapper);
            if (scroll) scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.style.height = 'auto';

            appendMessage(userName, text, 'user');
            saveMsg('user', text);

            const loadId = 'load-' + Date.now();
            const loadDiv = document.createElement('div');
            loadDiv.id = loadId;
            loadDiv.className = 'flex gap-3 max-w-[85%] mr-auto items-center text-gray-400 text-sm py-2';
            loadDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-xs font-bold text-white shadow">${aiName.charAt(0).toUpperCase()}</div>
                <div class="bg-geminiAi px-4 py-3 rounded-2xl rounded-tl-none border border-gray-700/50 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-pink-400 animate-bounce"></span>
                    <span class="w-2 h-2 rounded-full bg-pink-400 animate-bounce [animation-delay:0.2s]"></span>
                    <span class="w-2 h-2 rounded-full bg-pink-400 animate-bounce [animation-delay:0.4s]"></span>
                    <span class="text-xs ml-1">escribiendo...</span>
                </div>
            `;
            chatContainer.appendChild(loadDiv);
            scrollToBottom();

            try {
                const aiReply = await callGroqAPIWithFallback(text);
                document.getElementById(loadId)?.remove();
                appendMessage(aiName, aiReply, 'assistant');
                saveMsg('assistant', aiReply);
            } catch (err) {
                document.getElementById(loadId)?.remove();
                const errorText = `Ocurrió un inconveniente al responder (${err.message}). Inténtalo nuevamente en un instante.`;
                appendMessage(aiName, errorText, 'assistant');
            }
        });

        async function callGroqAPIWithFallback(userMessage) {
            const currentStyleObj = PERSONALITY_PROMPTS[aiStyle] || PERSONALITY_PROMPTS['tierna_celosa'];
            const systemPrompt = `Eres "${aiName}", la pareja de ${userName}. ${currentStyleObj.prompt(userName, userGender)} RESPONDE DE MANERA TOTALMENTE HUMANA Y CASUAL COMO EN UN CHAT REAL. NO USES EMOJIS O ÚSALOS EXTREMADAMENTE RARO. JAMÁS MENCIONES QUE ERES UNA IA NI DE MUESTRAS DE SER UN ASISTENTE DE TEXTO.`;

            const messages = [
                { role: "system", content: systemPrompt },
                ...chatHistory.slice(-10).map(i => ({
                    role: i.role === 'user' ? 'user' : 'assistant',
                    content: i.content
                })),
                { role: "user", content: userMessage }
            ];

            for (const modelCandidate of GROQ_MODELS) {
                try {
                    const response = await fetch(GROQ_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${GROQ_API_KEY}`
                        },
                        body: JSON.stringify({
                            model: modelCandidate,
                            messages: messages,
                            temperature: 0.8,
                            max_tokens: 1024
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.choices && data.choices[0]?.message?.content) {
                            return data.choices[0].message.content;
                        }
                    }
                } catch (e) {
                    // Silently failover to next model
                }
            }

            throw new Error("No se pudo conectar con el servicio de respuestas.");
        }
    </script>
</body>
</html>
